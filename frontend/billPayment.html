<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Payment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="bill-payment-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-bill-payment">&times;</span>
            <h2>Bill Payment</h2>
            <form id="bill-payment-form">
                <label for="bill-type">Bill Type:</label>
                <select id="bill-type" required>
                    <option value="rent">Rent</option>
                    <option value="cable">Cable</option>
                    <option value="electricity">Electricity</option>
                </select>
                <label for="bill-amount">Amount:</label>
                <input type="number" id="bill-amount" required>
                <button type="submit">Pay Bill</button>
            </form>
        </div>
    </div>
    <script src="scripts/common.js"></script>
    <script src="scripts/billPayment.js"></script>
    <script>
        // Get the modal
        var modal = document.getElementById("bill-payment-modal");

        // Get the <span> element that closes the modal
        var span = document.getElementById("close-bill-payment");
        
        // When the user clicks on <span> (x), close the modal
        span.onclick = function() {
            modal.style.display = "none";
            goBack();   
        }

        // When the user clicks anywhere outside of the modal, close it
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
            goBack();   
        }

        // Display the modal when the page loads
        window.onload = function() {
            modal.style.display = "block";
        }
    </script>
</body>
</html>
