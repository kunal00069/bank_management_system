<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loan-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-loan">&times;</span>
            <h2>Loan</h2>
            <form id="loan-form">
                <label for="loan-amount">Amount:</label>
                <input type="number" id="loan-amount" required>
                <button type="submit">Apply for Loan</button>
            </form>
        </div>
    </div>
    <script src="scripts/loan.js"></script>
    <script>
        // Get the modal
        var modal = document.getElementById("loan-modal");

        // Get the <span> element that closes the modal
        var span = document.getElementById("close-loan");

        // When the user clicks on <span> (x), close the modal
        span.onclick = function() {
            modal.style.display = "none";
        }

        // When the user clicks anywhere outside of the modal, close it
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // Display the modal when the page loads
        window.onload = function() {
            modal.style.display = "block";
        }
    </script>
</body>
</html>
