<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="insurance-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-insurance">&times;</span>
            <h2>Insurance</h2>
            <form id="insurance-form">
                <label for="insurance-type">Insurance Type:</label>
                <select id="insurance-type" required>
                    <option value="health">Health</option>
                    <option value="life">Life</option>
                    <option value="vehicle">Vehicle</option>
                </select>
                <label for="insurance-amount">Amount:</label>
                <input type="number" id="insurance-amount" required>
                <button type="submit">Apply for Insurance</button>
            </form>
        </div>
    </div>
    <script src="scripts/common.js"></script>
    <script src="scripts/insurance.js"></script>
    <script>
        // Get the modal
        var modal = document.getElementById("insurance-modal");

        // Get the <span> element that closes the modal
        var span = document.getElementById("close-insurance");

        function goBack() {
            const href = window.location.href;
            const href_split = href.split("/");
            href_split.pop();
            window.location.herf = href_split.join("/");
        }

        // When the user clicks on <span> (x), close the modal
        span.onclick = function() {
            modal.style.display = "none";
            goBack();
        }

        // When the user clicks anywhere outside of the modal, close it
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
            goBack();
        }

        // Display the modal when the page loads
        window.onload = function() {
            modal.style.display = "block";
        }
    </script>
</body>
</html>
