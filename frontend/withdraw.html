<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="withdraw-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-withdraw">&times;</span>
            <h2>Withdraw</h2>
            <form id="withdraw-form">
                <label for="withdraw-amount">Amount:</label>
                <input type="number" id="withdraw-amount" required>
                <button type="submit">Withdraw</button>
            </form>
        </div>
    </div>
    <script src="scripts/common.js"></script>
    <script src="scripts/withdraw.js"></script>
    <script>
        // Get the modal
        var modal = document.getElementById("withdraw-modal");

        // Get the <span> element that closes the modal
        var span = document.getElementById("close-withdraw");

        function goBack() {
            const href = window.location.href;
            const href_split = href.split("/");
            href_split.pop();
            window.location.herf = href_split.join("/");
        }

        // When the user clicks on <span> (x), close the modal
        span.onclick = function() {
            modal.style.display = "none";
            goBack();
        }

        // When the user clicks anywhere outside of the modal, close it
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
            goBack();
        }

        // Display the modal when the page loads
        window.onload = function() {
            modal.style.display = "block";
        }
    </script>
</body>
</html>
